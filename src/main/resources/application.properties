spring.application.name=job-portal
# Server port
server.port=8080

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:careerpulse_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console to view tables in browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Automatically create and update SQL tables from Java classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.ai.openai.api-key=dummy-test-key-12345